name: Feature request
description: Suggest an idea for the website or the internal app
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where should this live?
      options:
        - Public website (apps/web)
        - Internal app — web (apps/app)
        - Internal app — native (Android / desktop)
        - Backend API / database
        - Shared package (packages/shared)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case and why the current state falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine this working?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything else that was tried or considered.
