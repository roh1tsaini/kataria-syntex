name: Pipeline

# One workflow for everything:
#   gate (shared app renderer) → [deploy-web, desktop, android] in parallel
#   [desktop, android] → publish-r2 → deploy-app
#
# Runs on GitHub-hosted runners. Temporary workflow artifacts are cleaned up
# before uploads and after all jobs finish.
# Native packaging (desktop installers + Android APK) is gated to release pushes
# (when apps/app/package.json version differs from live R2 manifest) and manual
# workflow_dispatch runs, avoiding ~15 min of wasted compute on routine PRs and
# non-release commits.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to build"
        type: choice
        options:
          - all
          - desktop
          - android
        default: all
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  # A manual run must not cancel a push already deploying this branch. A newer
  # push can still cancel an older manual run so the newest commit wins.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

# Artifacts hand off the shared app renderer and installers between jobs. The
# pipeline deletes them before and after each run. One-day retention is a
# fallback if cleanup cannot run. R2 remains the release distribution.
env:
  RELEASE_ARTIFACT_RETENTION_DAYS: 1

jobs:
  prune-artifacts:
    name: "Free storage from completed Pipeline artifacts"
    concurrency:
      group: pipeline-artifact-prune-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from completed Pipeline runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull requests do not upload artifacts; skipping cleanup."
            exit 0
          fi
          RUN_IDS_FILE="$RUNNER_TEMP/completed-run-ids.txt"
          gh api --paginate "repos/$GH_REPO/actions/workflows/pipeline.yml/runs?status=completed&per_page=100&sort=created&direction=desc" --jq '.workflow_runs[].id' > "$RUN_IDS_FILE"
          declare -A completed_run_ids=()
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            completed_run_ids["$run_id"]=1
          done < "$RUN_IDS_FILE"

          ARTIFACTS_FILE="$RUNNER_TEMP/existing-artifacts.tsv"
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, (.workflow_run.id // "")] | @tsv' > "$ARTIFACTS_FILE"
          while IFS=$'\t' read -r artifact_id run_id; do
            [ -n "$artifact_id" ] || continue
            if [ -n "$run_id" ]; then
              if [ -n "${completed_run_ids[$run_id]+x}" ]; then
                gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
              fi
            fi
          done < "$ARTIFACTS_FILE"

  gate:
    name: "Gate: typecheck, lint, format, build"
    needs: prune-artifacts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      is_release: ${{ steps.version_info.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Require main for release publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.targets == 'all' && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "::error::Run an all-target release from main so only main can publish to R2."
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, and build
        env:
          VITE_API_URL: ${{ vars.APP_URL }}
        run: bunx turbo run typecheck lint build

      - name: Format check
        run: bun run format:check

      # AGENTS.md Section 4.0.1: version and minAppVersion bump together. A
      # floor above the version being shipped can never be satisfied by any
      # installable release — every client below it would be answered 426 with
      # nothing to install. Caught here in seconds, not after a build.
      # Also resolves whether this run is a release (version bumped or workflow_dispatch).
      - name: Resolve release targets
        id: version_info
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version apps/app/package.json)
          MIN=$(jq -r '.minAppVersion // "0.0.0"' apps/app/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$(printf '%s\n%s\n' "$VERSION" "$MIN" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::minAppVersion ($MIN) is above version ($VERSION) — bump version to the floor or above it."
            exit 1
          fi
          echo "version $VERSION satisfies floor $MIN"

          IS_RELEASE="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_RELEASE="true"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "$APP_URL" ]; then
              APP_HOST="${APP_URL#*://}"
              APP_HOST="${APP_HOST%/}"
              MANIFEST="https://$APP_HOST/releases/app/android/latest.json"
              LIVE_VERSION=$(curl -fsS --max-time 10 "$MANIFEST" 2>/dev/null | jq -r '.version // empty' || true)
              if [ "$LIVE_VERSION" != "$VERSION" ]; then
                echo "Live release version (${LIVE_VERSION:-none}) differs from repo version ($VERSION) — triggering native release."
                IS_RELEASE="true"
              else
                echo "Version $VERSION is already live on R2 — skipping native packaging."
              fi
            else
              IS_RELEASE="true"
            fi
          fi
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Upload shared app renderer
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: ks-biz-app-renderer
          path: apps/app/dist
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  deploy-web:
    name: "Deploy Website to Cloudflare"
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # D1 steps run before the build: vinext bakes a resolved copy of
      # wrangler.jsonc into dist/server at build time, so the real database id
      # must already be injected when the build happens.
      - name: Ensure website D1 database exists (inquiry DB)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r '.result[] | select(.name == "ks-web-db") | .uuid' | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" --data '{"name":"ks-web-db"}' "$API" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ]; then echo "Failed to resolve ks-web-db database id" >&2; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.jsonc

      - name: Apply website D1 migrations (inquiry DB)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply ks-web-db --remote

      - name: Build Vinext worker
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.SITE_URL || 'https://web.katariasyntex.workers.dev' }}
        run: bun run build

      - name: Deploy website worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx vinext-cloudflare deploy --skip-build

  desktop:
    name: "Desktop (${{ matrix.name }})"
    if: ${{ !cancelled() && needs.gate.result == 'success' && ((github.event_name == 'push' && needs.gate.outputs.is_release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.targets != 'android')) }}
    needs: gate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            builder_args: --win
            bundle_path: apps/app/release/*.exe*
          - platform: macos-latest
            name: macos-arm64
            builder_args: --mac
            bundle_path: apps/app/release/*.dmg
          - platform: ubuntu-24.04
            name: linux-x64
            builder_args: --linux
            bundle_path: apps/app/release/*.AppImage
    steps:
      - uses: actions/checkout@v6

      - name: Download shared app renderer
        uses: actions/download-artifact@v8
        with:
          name: ks-biz-app-renderer
          path: apps/app/dist

      - name: Require APP_URL variable
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the repository variable APP_URL (app FQDN, no trailing slash) before building native apps."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The gate's renderer artifact is shared across shells. This step builds
      # only Electron's main/preload and packages this platform's installer.
      - name: Build main/preload + package
        working-directory: apps/app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          bun run build:electron
          bunx electron-builder --config electron-builder.yml ${{ matrix.builder_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ks-biz-app-${{ matrix.name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  android:
    name: "Android APK (ARM phones)"
    if: ${{ !cancelled() && needs.gate.result == 'success' && ((github.event_name == 'push' && needs.gate.outputs.is_release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.targets != 'desktop')) }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Download shared app renderer
        uses: actions/download-artifact@v8
        with:
          name: ks-biz-app-renderer
          path: apps/app/dist

      # Fast fail: validate required variables and secrets immediately before heavy tool installs
      - name: Validate environment and signing secrets
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the repository variable APP_URL (app FQDN, no trailing slash) before building the Android app."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::ANDROID_KEY_BASE64 secret is missing."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          cat > apps/android/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore.p12
          storePassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync shared web bundle into Android
        # cap sync runs from apps/android — it owns capacitor.config.ts (which
        # points webDir at ../app/dist) and the Capacitor CLI dependency. The
        # gate built this bundle with VITE_API_URL and the artifact is shared
        # with the web and Electron shells.
        working-directory: apps/android
        run: bunx cap sync android

      - name: Build signed release APK
        working-directory: apps/android/android
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # APP_URL may carry a scheme (https://host) — the manifest's
          # android:host placeholder and BuildConfig.APP_HOST (the origin the
          # installer plugin will accept) both need the bare FQDN, so
          # normalize once here. A scheme-carrying APP_HOST made every APK
          # download fail the plugin's host check, locking stale clients
          # behind the 426 dialog forever.
          APP_HOST="${APP_URL#*://}"
          APP_HOST="${APP_HOST%/}"
          ./gradlew assembleRelease -PAPP_HOST="$APP_HOST"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ks-biz-app-android
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}

  publish-r2:
    name: "Publish releases to R2"
    # Push builds publish only when package.json's version differs from what
    # R2 hosts; manual dispatch publishes when all targets are selected.
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') && ((github.event_name == 'push' && needs.gate.outputs.is_release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.targets == 'all')) }}
    needs: [gate, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read app version
        id: app_version
        run: echo "version=$(jq -r .version apps/app/package.json)" >> "$GITHUB_OUTPUT"

      # Auto-provisions the R2 release bucket (installers + update manifests,
      # served at /releases/*). The API token needs "Workers R2 Storage Edit"
      # — a token without it fails here with Cloudflare's 403, loudly.
      - name: Ensure R2 release bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          EXISTS=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r '.result.buckets[]? | select(.name == "ks-releases") | .name' | head -1)
          if [ -z "$EXISTS" ]; then
            CREATED=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data '{"name":"ks-releases"}' "$API" | jq -r '.success')
            if [ "$CREATED" != "true" ]; then echo "Failed to create ks-releases bucket (check token R2 permissions)" >&2; exit 1; fi
          fi

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Inspect downloaded files
        run: ls -laR dist

      - name: Generate release info and Electron feeds, publish to R2
        working-directory: apps/app
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ks-releases
          VERSION: ${{ steps.app_version.outputs.version }}
          DIST_DIR: ${{ github.workspace }}/dist
          RELEASES_ORIGIN: ${{ vars.APP_URL }}
          ONLY_IF_VERSION_CHANGED: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bun scripts/publish-releases.ts

  deploy-app:
    name: "Deploy App to Cloudflare"
    # Deploys the business app worker. Release pushes and manual all-target
    # runs deploy only after publish-r2 succeeds, so clients never receive 426
    # update_required before the matching release is live. Failed native builds
    # prevent the app deploy.
    if: ${{ !cancelled() && needs.gate.result == 'success' && ((github.event_name == 'push' && (needs.gate.outputs.is_release != 'true' || needs.publish-r2.result == 'success')) || (github.event_name == 'workflow_dispatch' && inputs.targets == 'all' && github.ref == 'refs/heads/main' && needs.publish-r2.result == 'success')) }}
    needs: [gate, publish-r2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download shared app renderer
        uses: actions/download-artifact@v8
        with:
          name: ks-biz-app-renderer
          path: apps/app/dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Auto-provisions the DB and injects its real id into wrangler.jsonc on
      # the runner, so a fresh Cloudflare account needs no manual dashboard
      # step.
      - name: Ensure app D1 database exists
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_ADMIN_ID: ${{ vars.TELEGRAM_ADMIN_ID }}
        run: |
          set -euo pipefail
          # Same rule as the Telegram step: a bare failing test prints nothing,
          # so a missing variable looks identical to a broken deploy.
          [ -n "${TELEGRAM_ADMIN_ID:-}" ] || { echo "::error::TELEGRAM_ADMIN_ID variable is not set (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          [[ "$TELEGRAM_ADMIN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "::error::TELEGRAM_ADMIN_ID must be a bare numeric Telegram user id"; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r '.result[] | select(.name == "ks-biz-app-db") | .uuid' | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" --data '{"name":"ks-biz-app-db"}' "$API" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ]; then echo "Failed to resolve ks-biz-app-db database id" >&2; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.jsonc
          sed -i "s/\"TELEGRAM_ADMIN_ID\": \"\"/\"TELEGRAM_ADMIN_ID\": \"$TELEGRAM_ADMIN_ID\"/" wrangler.jsonc

      # Runs BEFORE the migration on purpose. A migration is the one step in
      # this job that cannot be rolled back, so every fallible check that guards
      # it has to pass first: with this order a bad Telegram secret leaves the
      # database untouched. The reverse order is what produced the incident
      # where the schema moved to 0.29 while the worker stayed on 0.25.3 and
      # every failed password login returned 500.
      - name: Set Telegram Worker secrets
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # A bare `test -n` or `[[ =~ ]]` exits 1 with no output at all, which
          # is how this step failed twice with no clue why. Every guard below
          # names itself, and never echoes the value.
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || { echo "::error::TELEGRAM_BOT_TOKEN is empty - set it under Settings > Secrets and variables > Actions > Secrets"; exit 1; }
          [ -n "${TELEGRAM_WEBHOOK_SECRET:-}" ] || { echo "::error::TELEGRAM_WEBHOOK_SECRET is empty - set it under Settings > Secrets and variables > Actions > Secrets"; exit 1; }
          # Telegram's secret_token accepts exactly A-Z a-z 0-9 _ - . A value
          # pasted with a trailing newline or a stray character fails here and
          # has to fail here, not at the webhook registration at the end.
          SECRET="$(printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | tr -d '[:space:]')"
          if ! printf '%s' "$SECRET" | grep -qE '^[A-Za-z0-9_-]{1,256}$'; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET must be 1-256 characters from A-Z a-z 0-9 _ - only (length was ${#SECRET})"
            exit 1
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | bunx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$SECRET" | bunx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          echo "Telegram Worker secrets set"

      - name: Apply app D1 migrations
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply ks-biz-app-db --remote

      - name: Ensure R2 release bucket exists
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          EXISTS=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r '.result.buckets[]? | select(.name == "ks-releases") | .name' | head -1)
          if [ -z "$EXISTS" ]; then
            CREATED=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data '{"name":"ks-releases"}' "$API" | jq -r '.success')
            if [ "$CREATED" != "true" ]; then echo "Failed to create ks-releases bucket (check token R2 permissions)" >&2; exit 1; fi
          fi

      - name: Deploy app worker
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: bun
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          command: deploy

      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ADMIN_ID: ${{ vars.TELEGRAM_ADMIN_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_ADMIN_ID"
          [[ "$TELEGRAM_ADMIN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          test -n "$APP_URL"
          case "$APP_URL" in
            https://*) APP_ORIGIN="${APP_URL%/}" ;;
            http://*) echo "APP_URL must use HTTPS" >&2; exit 1 ;;
            *) APP_ORIGIN="https://${APP_URL%/}" ;;
          esac
          if [[ ! "$APP_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "APP_URL must be an HTTPS origin or bare hostname" >&2
            exit 1
          fi
          WEBHOOK_URL="${APP_ORIGIN}/api/telegram/webhook"
          RESPONSE=$(curl -fsS --max-time 20 -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg url "$WEBHOOK_URL" --arg secret "$TELEGRAM_WEBHOOK_SECRET" '{url:$url,secret_token:$secret}')")
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null

  cleanup-history:
    name: "Keep the latest five Pipeline runs"
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      [
        gate,
        deploy-web,
        desktop,
        android,
        publish-r2,
        deploy-app,
        cleanup-artifacts,
      ]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete older completed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_IDS_FILE="$RUNNER_TEMP/completed-run-ids.txt"
          gh api --paginate "repos/$GH_REPO/actions/workflows/pipeline.yml/runs?status=completed&per_page=100&sort=created&direction=desc" --jq '.workflow_runs[].id' > "$RUN_IDS_FILE"
          mapfile -t completed_run_ids < "$RUN_IDS_FILE"

          kept_count=0
          for run_id in "${completed_run_ids[@]}"; do
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              continue
            fi
            if [ "$kept_count" -lt 5 ]; then
              kept_count=$((kept_count + 1))
              continue
            fi
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id"
          done

  cleanup-artifacts:
    name: "Delete this run's temporary artifacts"
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      [
        prune-artifacts,
        gate,
        deploy-web,
        desktop,
        android,
        publish-r2,
        deploy-app,
      ]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts after all consumers finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_IDS_FILE="$RUNNER_TEMP/current-run-artifact-ids.txt"
          gh api --paginate "repos/$GH_REPO/actions/runs/$CURRENT_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].id' > "$ARTIFACT_IDS_FILE"
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
          done < "$ARTIFACT_IDS_FILE"
