name: Pipeline

# One workflow for everything: quality gate → (deploy | desktop | android)
# in parallel → publish to R2. Runs on GitHub-hosted runners; the repo is
# public, so runner minutes are free regardless of OS.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to build"
        type: choice
        options:
          - all
          - desktop
          - android
        default: all
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Artifacts only hand off installers between jobs — the real distribution is
# R2 + GitHub Releases. Short retention keeps the account's artifact storage
# quota free (each run uploads ~400MB of installers).
env:
  ACTIONS_ARTIFACT_RETENTION_DAYS: 3
  # NOTE: VITE_API_URL is deliberately NOT set here. The deploy job builds
  # the web/PWA SPA same-origin; a baked API origin there must stay scoped to
  # the desktop job below (the repo variable APP_URL is a bare FQDN, and a
  # scheme-less origin turns every fetch() URL relative — app shows offline).

jobs:
  gate:
    name: "Gate: typecheck, lint, format, build"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

  deploy:
    name: "Deploy to Cloudflare"
    # Deploys to the single production workers — no PR previews.
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ---- Business app (SPA + Hono API in one worker) ----

      - name: Build app SPA
        run: bun run --cwd apps/app build

      # Auto-provisions the DB and injects its real id into wrangler.jsonc on
      # the runner, so a fresh Cloudflare account needs no manual dashboard
      # step.
      - name: Ensure app D1 database exists
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r '.result[] | select(.name == "ks-biz-app-db") | .uuid' | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" --data '{"name":"ks-biz-app-db"}' "$API" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ]; then echo "Failed to resolve ks-biz-app-db database id" >&2; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.jsonc

      - name: Apply app D1 migrations
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply ks-biz-app-db --remote

      # Auto-provisions the R2 release bucket (installers + update manifests,
      # served at /releases/*). The API token needs "Workers R2 Storage Edit"
      # — a token without it fails here with Cloudflare's 403, loudly.
      - name: Ensure R2 release bucket exists
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          EXISTS=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r '.result.buckets[]? | select(.name == "ks-releases") | .name' | head -1)
          if [ -z "$EXISTS" ]; then
            CREATED=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data '{"name":"ks-releases"}' "$API" | jq -r '.success')
            if [ "$CREATED" != "true" ]; then echo "Failed to create ks-releases bucket (check token R2 permissions)" >&2; exit 1; fi
          fi

      - name: Deploy app worker
        uses: cloudflare/wrangler-action@v4
        with:
          packageManager: bun
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          command: deploy

      # ---- Website (Vinext worker + inquiry DB) ----

      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web

      # D1 steps run before the build: vinext bakes a resolved copy of
      # wrangler.jsonc into dist/server at build time, so the real database id
      # must already be injected when the build happens.
      - name: Ensure website D1 database exists (inquiry DB)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r '.result[] | select(.name == "ks-web-db") | .uuid' | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" --data '{"name":"ks-web-db"}' "$API" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ]; then echo "Failed to resolve ks-web-db database id" >&2; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.jsonc

      - name: Apply website D1 migrations (inquiry DB)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply ks-web-db --remote

      - name: Build Vinext worker
        working-directory: apps/web
        run: bun run build

      - name: Deploy website worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx vinext-cloudflare deploy --skip-build

  desktop:
    name: "Desktop (${{ matrix.name }})"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets != 'android' }}
    needs: gate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      # API origin for the packaged renderer (PDF downloads etc. read it at
      # build time). The APP_URL repo variable is the App FQDN, no scheme.
      VITE_API_URL: ${{ vars.APP_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            builder_args: --win
            bundle_path: |
              apps/app/release/*.exe*
              apps/app/release/latest.yml
          - platform: macos-latest
            name: macos-arm64
            builder_args: --mac
            bundle_path: apps/app/release/*.dmg
          - platform: ubuntu-24.04
            name: linux-x64
            builder_args: --linux
            bundle_path: |
              apps/app/release/*.AppImage
              apps/app/release/latest-linux.yml
    steps:
      - uses: actions/checkout@v6

      - name: Require APP_URL variable
        if: ${{ vars.APP_URL == '' }}
        run: |
          echo "::error::Set the repository variable APP_URL (app FQDN, no trailing slash) before building native apps."
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # No actions/cache anywhere in this workflow: private-repo cache+artifact
      # storage shares a 500MB quota, and electron/gradle caches blew through it
      # (each lockfile change minted a fresh 130-200MB entry). Downloads from
      # CDNs cost a couple of minutes per job instead.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build:electron bakes APP_URL into the main process (KC_API_ORIGIN);
      # the renderer build precedes it so electron-builder packages both.
      - name: Build renderer + main/preload + package
        working-directory: apps/app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          bun run build
          bun run build:electron
          bunx electron-builder --config electron-builder.yml ${{ matrix.builder_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ks-biz-app-${{ matrix.name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  android:
    name: "Android APK (ARM phones)"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets != 'desktop' }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Require APP_URL variable
        if: ${{ vars.APP_URL == '' }}
        run: |
          echo "::error::Set the repository variable APP_URL (app FQDN, no trailing slash) before building the Android app."
          exit 1

      - name: Install Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize API origin for the app bundle
        # The RN app is not same-origin with the backend, so it bakes the
        # absolute https:// origin at build time (EXTRA_API_BASE →
        # app.config.ts extra.apiBaseUrl → expo-constants). A bare FQDN
        # would build broken relative URLs.
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          APP_URL="https://${APP_URL#*://}"
          APP_URL="${APP_URL%/}"
          echo "EXTRA_API_BASE=$APP_URL" >> "$GITHUB_ENV"

      - name: Generate native project (Expo prebuild)
        working-directory: apps/android
        run: bunx expo prebuild -p android --no-install

      - name: Decode signing keystore from secrets
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::ANDROID_KEY_BASE64 secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"

      - name: Write keystore.properties
        working-directory: apps/android
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.p12
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ks-biz-app-android
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: "Publish GitHub Release"
    # Manual dispatch only — GitHub Releases are an internal record; R2 is the
    # distribution channel. Requires both build jobs to have succeeded or been
    # skipped by the targets choice.
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read app version
        id: app_version
        run: echo "version=$(jq -r .version apps/app/package.json)" >> "$GITHUB_OUTPUT"

      - name: Fail if the release tag already exists
        run: |
          if git rev-parse "v${{ steps.app_version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.app_version.outputs.version }} already exists — bump the version in apps/app/package.json before releasing."
            exit 1
          fi

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Inspect downloaded files
        run: ls -laR dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Kataria Syntex Biz App v${{ steps.app_version.outputs.version }}
          body: |
            Internal record — installers ship from the app's /download page.

            - **Android** (all phones): `*.apk` — signed. Allow "Install unknown apps" and open the file.
            - **Windows**: `*-setup.exe` — NSIS installer. SmartScreen may warn (unsigned); click "More info → Run anyway".
            - **macOS**: `*.dmg` — Apple Silicon. Right-click → Open to bypass Gatekeeper.
            - **Linux**: `*.AppImage` — `chmod +x` and run.
          generate_release_notes: false
          files: dist/**
          fail_on_unmatched_files: false

  publish-r2:
    name: "Publish releases to R2"
    # Push builds publish only when package.json's version differs from what
    # R2 hosts (enforced in publish-releases.ts); manual dispatch always
    # publishes. Runs after the release job so GitHub history and R2 stay in
    # step on dispatches.
    if: ${{ !cancelled() && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') && (github.event_name != 'workflow_dispatch' || needs.release.result == 'success' || needs.release.result == 'skipped') }}
    needs: [desktop, android, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Read app version
        id: app_version
        run: echo "version=$(jq -r .version apps/app/package.json)" >> "$GITHUB_OUTPUT"

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Inspect downloaded files
        run: ls -laR dist

      - name: Upload to R2 + verify release (latest-only retention)
        working-directory: apps/app
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ks-releases
          VERSION: ${{ steps.app_version.outputs.version }}
          DIST_DIR: ${{ github.workspace }}/dist
          RELEASES_ORIGIN: ${{ vars.APP_URL }}
          # Push builds: skip silently when this version is already live.
          ONLY_IF_VERSION_CHANGED: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bun scripts/publish-releases.ts
