<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get the app — Kataria Syntex Biz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── CSS Reset ─────────────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Exact Kataria Syntex Design Tokens (apps/app/src/main/ui/globals.css) ─ */
      :root {
        color-scheme: light;
        --font-sans:
          "Inter Variable", Inter, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

        /* Light Palette (Default) */
        --background: oklch(0.99 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.145 0 0);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --secondary: oklch(0.97 0 0);
        --secondary-foreground: oklch(0.205 0 0);
        --border: oklch(0.922 0 0);
        --border-subtle: oklch(0.95 0 0);

        --a-strong: oklch(0.22 0.005 260);
        --a-fg: oklch(0.985 0 0);
        --a-soft: oklch(0.22 0.005 260 / 7%);
        --a-ink: oklch(0.32 0.008 260);

        --primary: var(--a-strong);
        --primary-foreground: var(--a-fg);
        --accent: var(--a-soft);
        --accent-foreground: var(--a-ink);
        --ring: var(--a-strong);

        --radius-sm: 0.5rem; /* 8px */
        --radius-md: 0.625rem; /* 10px */
        --radius-lg: 0.75rem; /* 12px */
        --radius-xl: 1rem; /* 16px */
        --radius-2xl: 1.25rem; /* 20px */
        --radius-full: 9999px;

        --shadow-soft: 0 1px 2px oklch(0 0 0 / 5%);
        --shadow-lift:
          0 4px 12px -4px oklch(0 0 0 / 10%), 0 2px 6px -2px oklch(0 0 0 / 6%);
        --shadow-overlay:
          0 8px 24px -8px oklch(0 0 0 / 14%), 0 4px 12px -4px oklch(0 0 0 / 8%);
        --specular: inset 0 1px 0 oklch(1 0 0 / 55%);

        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-morph: cubic-bezier(0.16, 1, 0.3, 1);
      }

      :root.dark,
      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0);
        --card-foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --secondary: oklch(0.269 0 0);
        --secondary-foreground: oklch(0.985 0 0);
        --border: oklch(1 0 0 / 10%);
        --border-subtle: oklch(1 0 0 / 6%);

        --a-strong: oklch(0.93 0 0);
        --a-fg: oklch(0.16 0 0);
        --a-soft: oklch(1 0 0 / 10%);
        --a-ink: oklch(0.88 0 0);

        --primary: var(--a-strong);
        --primary-foreground: var(--a-fg);
        --accent: var(--a-soft);
        --accent-foreground: var(--a-ink);
        --ring: var(--a-strong);

        --shadow-soft: 0 1px 2px oklch(0 0 0 / 25%);
        --shadow-lift:
          0 4px 12px -4px oklch(0 0 0 / 40%), 0 2px 6px -2px oklch(0 0 0 / 25%);
        --shadow-overlay:
          0 8px 24px -8px oklch(0 0 0 / 50%), 0 4px 12px -4px oklch(0 0 0 / 30%);
        --specular: inset 0 1px 0 oklch(1 0 0 / 8%);
      }

      body {
        min-height: 100dvh;
        background-color: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        display: flex;
        flex-direction: column;
        transition:
          background-color 150ms var(--ease-out),
          color 150ms var(--ease-out);
        padding-bottom: 96px; /* clearance for floating demo capsule */
      }

      /* ── Layout Container (Section 3.4 & Section 4: 640px / 40rem max) ──────── */
      .page-wrap {
        width: 100%;
        max-width: 40rem;
        margin-inline: auto;
        padding: clamp(32px, 6vw, 48px) 16px 40px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      /* ── Top Bar Lockup ─────────────────────────────────────────────────────── */
      .top-lockup {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand-box {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border-radius: var(--radius-xl); /* 16px */
        background-color: var(--foreground);
        color: var(--background);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        user-select: none;
      }

      .brand-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.25;
      }

      /* ── CircleButton Primitive (Section 2.7) ───────────────────────────────── */
      .circle-btn {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: var(--radius-full);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
        outline: none;
        transition:
          background-color 140ms var(--ease-out),
          color 140ms var(--ease-out),
          border-color 140ms var(--ease-out),
          transform 100ms var(--ease-out);
      }
      .circle-btn:hover {
        background-color: var(--muted);
        color: var(--foreground);
      }
      .circle-btn:active {
        transform: scale(0.97);
        background-color: var(--muted);
      }
      .circle-btn:focus-visible {
        box-shadow:
          0 0 0 2px var(--background),
          0 0 0 4px var(--ring);
      }
      .circle-btn svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Page Header ────────────────────────────────────────────────────────── */
      .page-header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .page-title {
        font-size: clamp(1.75rem, 1.3rem + 1.6vw, 2.25rem); /* 28-36px */
        font-weight: 700;
        letter-spacing: -0.022em;
        line-height: 1.05;
        text-wrap: balance;
        color: var(--foreground);
      }

      .page-status {
        min-height: 20px;
        font-size: 13px;
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
        line-height: 1.4;
      }

      /* ── Content Layout & Sections ─────────────────────────────────────────── */
      .content-flow {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .section-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .section-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-foreground);
        line-height: 1.4;
      }

      .section-heading {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
        color: var(--foreground);
      }

      /* ── Card Primitive (Section 2.2: radius-lg 12px) ───────────────────────── */
      .card {
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background-color: var(--card);
        color: var(--card-foreground);
        overflow: hidden;
        transition:
          border-color 150ms var(--ease-out),
          box-shadow 150ms var(--ease-out);
      }

      /* Recommended card has an accent hairline border, no solid fill */
      .card-recommended {
        border-color: color-mix(in oklch, var(--foreground) 16%, var(--border));
      }

      .recommended-body {
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* Content icon tile (40px, radius 12px, muted) */
      .content-icon-tile {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: var(--radius-lg);
        background-color: var(--muted);
        color: var(--muted-foreground);
      }
      .content-icon-tile svg {
        width: 20px;
        height: 20px;
      }
      .content-icon-tile svg.glyph-brand {
        fill: currentColor;
      }
      .content-icon-tile svg.glyph-stroke {
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .platform-meta {
        flex: 1;
        min-width: 0;
      }

      .platform-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.01em;
        color: var(--foreground);
      }

      .platform-file {
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted-foreground);
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Button Primitives (Section 2.3 & 3) ─────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        padding-inline: 16px;
        border-radius: var(--radius-full);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        text-decoration: none;
        border: 1px solid transparent;
        cursor: pointer;
        outline: none;
        flex-shrink: 0;
        transition:
          background-color 140ms var(--ease-out),
          color 140ms var(--ease-out),
          border-color 140ms var(--ease-out),
          transform 100ms var(--ease-out),
          opacity 140ms var(--ease-out);
      }
      .btn:active:not(:disabled) {
        transform: scale(0.97);
      }
      .btn:focus-visible {
        box-shadow:
          0 0 0 2px var(--background),
          0 0 0 4px var(--ring);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Button default (foreground fill) */
      .btn-default {
        background-color: var(--foreground);
        color: var(--background);
      }
      @media (hover: hover) {
        .btn-default:hover:not(:disabled) {
          opacity: 0.9;
        }
      }

      /* Button outline */
      .btn-outline {
        border-color: var(--border);
        background-color: var(--card);
        color: var(--foreground);
      }
      @media (hover: hover) {
        .btn-outline:hover:not(:disabled) {
          background-color: var(--muted);
          border-color: color-mix(
            in oklch,
            var(--foreground) 15%,
            var(--border)
          );
        }
      }

      /* Web Action Link (Section 3.4) */
      .web-action-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        margin-top: 2px;
        padding-inline: 12px;
        border-radius: var(--radius-full);
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-foreground);
        text-decoration: none;
        width: fit-content;
        margin-inline: auto;
        transition:
          color 140ms var(--ease-out),
          background-color 140ms var(--ease-out);
      }
      .web-action-link:hover {
        color: var(--foreground);
        background-color: var(--muted);
      }
      .web-action-link:active {
        transform: scale(0.98);
      }
      .web-action-link:focus-visible {
        box-shadow:
          0 0 0 2px var(--background),
          0 0 0 4px var(--ring);
      }
      .web-action-link svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Platform Rows List (Other devices) ─────────────────────────────────── */
      .platform-list {
        list-style: none;
      }

      .platform-row {
        display: flex;
        min-height: 64px;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      .platform-row + .platform-row {
        border-top: 1px solid var(--border);
      }

      /* ── Skeleton Loading States (Section 3.1) ──────────────────────────────── */
      .skeleton {
        background-color: var(--muted);
        border-radius: var(--radius-md);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      .skeleton-pill {
        border-radius: var(--radius-full);
      }

      /* ── Floating Demo Controller (No BS, Apple/Luma Capsule) ────────────────── */
      .demo-floating-capsule {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 6px;
        background: color-mix(in oklch, var(--card) 85%, transparent);
        backdrop-filter: blur(16px) saturate(1.4);
        -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        padding: 4px 6px;
        box-shadow: var(--shadow-overlay);
        font-size: 12px;
        transition:
          transform 200ms var(--ease-out),
          opacity 200ms var(--ease-out);
      }

      .demo-segmented {
        display: inline-flex;
        align-items: center;
        background: var(--muted);
        border-radius: var(--radius-full);
        padding: 2px;
        gap: 2px;
      }

      .demo-seg-btn {
        border: none;
        background: transparent;
        color: var(--muted-foreground);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: var(--radius-full);
        cursor: pointer;
        transition:
          background-color 140ms var(--ease-out),
          color 140ms var(--ease-out),
          box-shadow 140ms var(--ease-out);
        white-space: nowrap;
      }
      .demo-seg-btn:hover {
        color: var(--foreground);
      }
      .demo-seg-btn.active {
        background: var(--card);
        color: var(--foreground);
        font-weight: 600;
        box-shadow: var(--shadow-soft);
      }

      .demo-divider {
        width: 1px;
        height: 18px;
        background: var(--border);
        margin-inline: 2px;
      }

      .demo-minimize-btn {
        background: transparent;
        border: none;
        color: var(--muted-foreground);
        width: 28px;
        height: 28px;
        border-radius: var(--radius-full);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .demo-minimize-btn:hover {
        color: var(--foreground);
      }

      .demo-collapsed-trigger {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 99;
        display: none;
      }

      /* ── Mobile & Touch Refinements (Section 2.3) ───────────────────────────── */
      @media (max-width: 540px) {
        .page-wrap {
          padding-top: 24px;
          gap: 24px;
        }
        .recommended-body {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
          padding: 16px;
        }
        .recommended-top-row {
          display: flex;
          align-items: center;
          gap: 12px;
          width: 100%;
        }
        .btn {
          height: 44px; /* 44px touch floor below sm */
        }
        .recommended-body .btn {
          width: 100%;
        }
        .platform-row .btn {
          height: 40px;
        }
        .demo-floating-capsule {
          max-width: calc(100vw - 24px);
          overflow-x: auto;
          scrollbar-width: none;
        }
        .demo-floating-capsule::-webkit-scrollbar {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
        .btn:active,
        .circle-btn:active,
        .web-action-link:active {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-wrap">
      <!-- ── Brand Lockup & Top Theme Action ── -->
      <header class="top-lockup">
        <a class="brand-box" href="#" aria-label="Kataria Syntex Biz App home">
          <div class="brand-mark" aria-hidden="true">K</div>
          <div class="brand-title">Kataria Syntex Biz App</div>
        </a>
        <button
          class="circle-btn"
          id="theme-toggle"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          <!-- Moon icon (when in light) -->
          <svg id="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <!-- Sun icon (when in dark) -->
          <svg
            id="theme-icon-sun"
            viewBox="0 0 24 24"
            style="display: none"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>
      </header>

      <!-- ── Page Heading & Version Status ── -->
      <section class="page-header" aria-labelledby="main-heading">
        <h1 class="page-title" id="main-heading">Get the app</h1>
        <div
          class="page-status"
          id="version-status"
          role="status"
          aria-live="polite"
        >
          Latest version 0.25.3
        </div>
      </section>

      <!-- ── Dynamic Content Slot ── -->
      <div class="content-flow" id="content-container">
        <!-- Rendered by JavaScript based on state / platform -->
      </div>
    </main>

    <!-- ── Floating Demo Controller (No BS, Minimalist Capsule) ── -->
    <aside
      class="demo-floating-capsule"
      id="demo-capsule"
      aria-label="Demo controls"
    >
      <div
        class="demo-segmented"
        id="platform-segmented"
        role="radiogroup"
        aria-label="Simulated platform"
      >
        <button class="demo-seg-btn active" data-platform="win" type="button">
          Windows
        </button>
        <button class="demo-seg-btn" data-platform="mac" type="button">
          macOS
        </button>
        <button class="demo-seg-btn" data-platform="linux" type="button">
          Linux
        </button>
        <button class="demo-seg-btn" data-platform="android" type="button">
          Android
        </button>
        <button class="demo-seg-btn" data-platform="web" type="button">
          Unknown
        </button>
      </div>

      <div class="demo-divider"></div>

      <div
        class="demo-segmented"
        id="state-segmented"
        role="radiogroup"
        aria-label="Simulated state"
      >
        <button class="demo-seg-btn active" data-state="ready" type="button">
          Ready
        </button>
        <button class="demo-seg-btn" data-state="loading" type="button">
          Loading
        </button>
        <button class="demo-seg-btn" data-state="unavailable" type="button">
          Unavailable
        </button>
      </div>

      <div class="demo-divider"></div>

      <button
        class="demo-minimize-btn"
        id="btn-minimize-demo"
        type="button"
        title="Hide demo toolbar"
        aria-label="Hide demo toolbar"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </aside>

    <div class="demo-collapsed-trigger" id="demo-restore-container">
      <button
        class="circle-btn"
        id="btn-restore-demo"
        type="button"
        title="Show demo options"
        aria-label="Show demo options"
        style="background: var(--card); box-shadow: var(--shadow-lift)"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path

      const moonIcon = document.getElementById("theme-icon-moon");
      const sunIcon = document.getElementById("theme-icon-sun");

      function applyTheme(isDark) {
        document.documentElement.classList.toggle("dark", isDark);
        if (isDark) {
          moonIcon.style.display = "none";
          sunIcon.style.display = "block";
          themeToggle.title = "Switch to light theme";
          themeToggle.setAttribute("aria-label", "Switch to light theme");
        } else {
          moonIcon.style.display = "block";
          sunIcon.style.display = "none";
          themeToggle.title = "Switch to dark theme";
          themeToggle.setAttribute("aria-label", "Switch to dark theme");
        }
      }

      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches;
      applyTheme(prefersDark);

      themeToggle.addEventListener("click", () => {
        const isCurrentlyDark =
          document.documentElement.classList.contains("dark");
        applyTheme(!isCurrentlyDark);
      });

      const platformButtons = document.querySelectorAll(
        "#platform-segmented .demo-seg-btn",
      );
      platformButtons.forEach((btn) => {

          platformButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentPlatform = btn.dataset.platform;
          render();
        });
      });

        "#state-segmented .demo-seg-btn",
      );
      stateButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          stateButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentState = btn.dataset.state;
          render();
        });
      });

      const restoreBtn = document.getElementById("demo-restore-container");
      const minimizeBtn = document.getElementById("btn-minimize-demo");
      const restoreTrigger = document.getElementById("btn-restore-demo");

      minimizeBtn.addEventListener("click", () => {
        capsule.style.display = "none";
        restoreBtn.style.display = "block";
      });

      restoreTrigger.addEventListener("click", () => {
        capsule.style.display = "flex";
        restoreBtn.style.display = "none";
      });
