apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Reads keystore.properties (written by CI from the ANDROID_KEY_* secrets).
// Declared at script scope — both the signing config and the release build
// type reference it. If the file is absent the release build stays unsigned —
// local/dev builds don't need a keystore.
def propsFile = rootProject.file('keystore.properties')

// App version comes from apps/app/package.json — the single source of truth
// shared by the web build, Electron and this Android shell. versionCode
// derives from semver (major*10000 + minor*100 + patch) so every bump
// increases it monotonically; Android rejects updates that don't.
def appVersionParts = new groovy.json.JsonSlurper()
    .parseText(rootProject.file('../../app/package.json').text)
    .version.tokenize('.').collect { it.toInteger() }
while (appVersionParts.size() < 3) appVersionParts << 0
def APP_VERSION = appVersionParts.join('.')
def APP_VERSION_CODE = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

// The one origin a release build may install from (InstallerPlugin refuses
// any other host). CI passes the same FQDN the bundle bakes as VITE_API_URL;
// a local build falls back to the placeholder so the manifest still merges.
def APP_HOST_VALUE = project.findProperty('APP_HOST') ?: 'localhost'
// APP_HOST is a bare FQDN only — a scheme (https://…), port or path poisons
// the deep-link manifest host AND BuildConfig.APP_HOST, which made the
// installer plugin reject every download (stale clients then sat locked out
// of the API by the 426 floor). Fail the build here, at source, instead of
// shipping an APK that can never update. The pipeline normalizes vars.APP_URL
// (which may carry a scheme) before passing -PAPP_HOST.
if (APP_HOST_VALUE =~ /[:\/\\\s]/) {
    throw new GradleException(
        "APP_HOST must be a bare hostname (no scheme, port or path). Got: '$APP_HOST_VALUE'"
    )
}

android {
    namespace = "com.katariasyntex.bizapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.katariasyntex.bizapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode APP_VERSION_CODE
        versionName APP_VERSION
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The host the https deep-link filter claims (the QR-login payload is
        // <origin>/login/scan/<code>). CI passes the same value the web bundle
        // bakes as VITE_API_URL; a local build without it gets a placeholder so
        // the manifest still merges — the filter just matches nothing real.
        manifestPlaceholders = [
            APP_HOST: APP_HOST_VALUE
        ]
        // The same value reaches the installer plugin, which refuses to feed
        // the system installer an APK from any other origin.
        buildConfigField "String", "APP_HOST", "\"${APP_HOST_VALUE}\""
        // ARM-only: the app ships to phones, never emulators; dropping x86
        // halves build time and never ships an emulator-only binary.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Required by AGP 8 for the generated BuildConfig class the installer
    // plugin reads (APP_HOST).
    buildFeatures {
        buildConfig true
    }
    // The Kotlin installer plugin compiles against Java 21 bytecode
    // (compileOptions above, from capacitor.build.gradle) — a mismatched
    // jvmTarget fails the build with "Inconsistent JVM-target compatibility".
    // Kotlin 2.x: the extension-level compilerOptions block is the supported
    // DSL (kotlinOptions was removed in Kotlin 2.2).
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }
    signingConfigs {
        release {
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (propsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// One artifact name for every platform, version included. The APK is served
// from R2 under a year-long immutable TTL, so an unversioned name would let
// any HTTP cache hand back a previous release's bytes for a year — and the
// manifest's SHA-256 check would then reject them. Version comes from
// apps/app/package.json, the same source as versionName above.
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("Kataria-Syntex-Biz-App-${APP_VERSION}.apk")
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
