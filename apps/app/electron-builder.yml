appId: com.katariasyntex.bizapp
productName: Kataria Syntex Biz App
# Derived binaries must be path-safe — the scoped package name
# (@kataria-syntex/biz-app) breaks the AppImage target.
executableName: kataria-syntex-biz-app
copyright: Kataria Syntex

directories:
  output: release
  buildResources: resources

# The renderer (dist/) and the main/preload bundles (dist-electron/) are both
# produced by `bun run electron:package` before this config runs.
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/**/*.map"
  - package.json

# Main process entry is package.json's "main" (dist-electron/main.cjs). The
# bundles are CommonJS (electron/build.ts format: "cjs"), so the packaged app
# must not inherit the workspace "type": "module" — Electron would load
# main.cjs as ESM and crash on require.
extraMetadata:
  type: commonjs

asar: true

win:
  # CPU targets come from the CLI — one arch per CI job (--x64 / --arm64);
  # a plain local build packages the host CPU. An arch list here would be
  # merged into the CLI map and silently build every listed arch.
  target:
    - target: nsis
  # Dash-named artifacts: what the builder writes is what gets stored in R2
  # and referenced by latest.yml — no renaming anywhere in the pipeline.
  # Both CPU targets share one feed, so the name must carry -${arch} to make
  # the two files distinct (the updater picks by process.arch in the name).
  artifactName: Kataria-Syntex-Biz-App-Setup-${version}-${arch}.${ext}
  icon: resources/icon.png

# One-click (per-user, silent): the updated installer runs without any UI, so
# the auto-update applies invisibly on quit. An assisted installer
# (oneClick: false) would raise a setup wizard every update.
nsis:
  oneClick: true
  # Per-CPU installers only — no combined ~215 MB universal file. The two
  # -x64 / -arm64 installers ship side by side, one download page row each.
  buildUniversalInstaller: false

mac:
  target:
    - target: dmg
      arch: [arm64]
  # Same dash-named pattern as win/linux — one naming scheme everywhere.
  artifactName: Kataria-Syntex-Biz-App-${version}-${arch}.${ext}
  category: public.app-category.business
  icon: resources/icon.png
  # QR-code scan/approve uses the camera — macOS blocks capture without a
  # usage description (the main process grants `media` only to app origins).
  extendInfo:
    NSCameraUsageDescription: Scan QR codes to sign in and approve devices.

linux:
  # Same as Windows: the CPU target comes from the CLI (--x64 / --arm64).
  # electron-builder renders x64 as x86_64 in AppImage names
  # (getArtifactArchName) — CI globs and publish discovery match that.
  target:
    - target: AppImage
  artifactName: Kataria-Syntex-Biz-App-${version}-${arch}.${ext}
  category: Office
  icon: resources/icon.png
