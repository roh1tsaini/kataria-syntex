appId: com.katariasyntex.bizapp
productName: Kataria Syntex Biz App
# Derived binaries must be path-safe — the scoped package name
# (@kataria-syntex/biz-app) breaks the AppImage target.
executableName: kataria-syntex-biz-app
copyright: Kataria Syntex

directories:
  output: release
  buildResources: resources

# The renderer (dist/) and the main/preload bundles (dist-electron/) are both
# produced by `bun run electron:package` before this config runs.
files:
  - dist/**
  - dist-electron/**
  - package.json

# Main process entry is package.json's "main" (dist-electron/main.js). The
# bundles are CommonJS (electron/build.ts format: "cjs"), so the packaged app
# must not inherit the workspace "type": "module" — Electron would load
# main.js as ESM and crash on require.
extraMetadata:
  type: commonjs

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.business
  icon: resources/icon.png
  # QR-code scan/approve uses the camera — macOS blocks capture without a
  # usage description (the main process grants `media` only to app origins).
  extendInfo:
    NSCameraUsageDescription: Scan QR codes to sign in and approve devices.

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  icon: resources/icon.png
